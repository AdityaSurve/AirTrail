services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: airtrail
      POSTGRES_PASSWORD: password
      POSTGRES_DB: airtrail
    ports:
      # Host port 5433 avoids clashing with a native Windows/macOS PostgreSQL on 5432.
      # Inside the Compose network, services still use postgres:5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 services.api.app:app
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://airtrail:password@postgres:5432/airtrail
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - minio

  worker:
    build: .
    command: celery -A services.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://airtrail:password@postgres:5432/airtrail
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - minio

  dashboard:
    build: .
    command: streamlit run services/dashboard/app.py
    volumes:
      - .:/app
    environment:
      - API_URL=http://api:5000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
